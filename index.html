/* Cover — illustration-first presentation with staged comic-book logo overlays. */
.book.is-cover .copy-zone{display:none}

/* v1.2 — comic-cut frame + washed lavender book backdrop */
html, body { background: #e9e1f0; }
body { background: radial-gradient(ellipse at 16% 8%, #f8f3fa 0%, transparent 48%), radial-gradient(ellipse at 88% 92%, #dcd0e8 0%, transparent 54%), #e9e1f0; }
.topbar { color: #42225b; }
.brand { color: #54276d; text-shadow: 0 1px 0 #ffffffa6; }
.top-btn { color: #542b71; border: 1px solid #9c7aae66; background: #ffffffa8; }
.top-btn:hover { background: #ffffffed; }
.footer-mid { color: #654b78; }
.desktop-hint { color: #7c698e; }
.book {
  border-radius: 0;
  border: 0;
  background: #77439c;
  padding: 4px;
  clip-path: none;
  box-shadow: none;
  overflow: hidden;
  filter: drop-shadow(0 10px 22px #3e205022);
}
.book::before {
  content: '';
  position: absolute;
  inset: 4px;
  background: var(--paper);
  clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
  z-index: 0;
}
.book > * {
  position: relative;
  z-index: 1;
}
@media(max-width:650px) {
 .book { padding: 3px; }
 .book::before { inset: 3px; clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); }
}

/* v1.3 — top navigation matches the yellow page-turn buttons */
.top-btn {
  color: #391653;
  border: 2px solid #f7cb4e;
  border-radius: 14px;
  background: #ffcd46;
  padding: 10px 18px;
  font-size: clamp(13px,1.25vw,17px);

.top-btn:hover { background: #ffe076; transform: translateY(-1px); }

@media (max-width:650px) { .top-actions .top-btn { min-height: 43px; } }

.vfx .yawn-bubble {

</style></head><body><main class="app" id="app"><header class="topbar"><span class="brand">🐾 CHEETAH GIRL · THE INTERACTIVE STORYBOOK</span><div class="top-actions"><button class="top-btn" id="homeBtn">⌂ Home</button><button class="top-btn" id="charsBtn">Meet the heroes</button></div></header><section class="book" id="bookShell" aria-label="Illustrated story page"><div class="art-zone" id="artZone"><img class="art" id="artImg" draggable="false" alt=""/><div class="vfx" id="vfx" aria-hidden="true"></div><img class="cover-overlay title-overlay" id="coverTitleArt" src="assets/Title.png" alt="Cheetah Girl and the Evil Cha Cha"/><img class="cover-overlay byline-overlay" id="coverBylineArt" src="assets/By-line.png" alt="By Uncle Kurtie and Aunt Beaaa"/><div id="hotspots"></div><button class="cover-prompt" id="coverPrompt" hidden>✦ Tap a hero to meet them!</button></div><div class="copy-zone"><div class="section-kicker" id="section"></div><h1 class="story-title" id="title"></h1><div class="story-prose" id="prose" aria-live="polite"></div><div class="hint" id="hint"></div></div></section><footer class="footer"><button class="nav" id="prevBtn">❮ Back</button><div class="footer-mid" id="footerMid">An adventure starring Ella and the Super Siblings</div><button class="nav" id="nextBtn">Next ❯</button></footer><div class="desktop-hint">Made with love for Ella · Tap the magic if you like, or just turn the page ✨</div></main>
<script>
const pages=[{"key": "cover", "image": "Page_00.png", "title": "Cheetah Girl and the Evil Cha Cha", "kind": "cover", "text": [], "effect": "cover"}, {"key": "char0", "image": "Page_01a.png", "title": "Meet Ella / Cheetah Girl", "kind": "character", "text": ["Our fearless hero. Her superpower is SUPER SPEED!"], "effect": "character"}, {"key": "char1", "image": "Page_01b.png", "title": "Meet Luke", "kind": "character", "text": ["Ella’s big brother. His superpower is SUPER STRENGTH!"], "effect": "character"}, {"key": "char2", "image": "Page_01c.png", "title": "Meet Quinn", "kind": "character", "text": ["Her superpower is a mighty GIGGLE BOOM!"], "effect": "character"}, {"key": "char3", "image": "Page_01d.png", "title": "Meet Baby Blake & Cousin Connie", "kind": "character", "text": ["Two tiny heroes. Their superpower is adorable DISTRACTION!"], "effect": "character"}, {"key": "char4", "image": "Page_01e.png", "title": "Meet Evil Cha Cha", "kind": "character", "text": ["A very dramatic uncle with a very sleepy plan!"], "effect": "character"}, {"key": "Page_02", "image": "Page_02.png", "title": "Ella the Cheetah", "kind": "story", "act": "The Birth of Cheetah Girl", "text": ["Ella loved cheetahs.", "She loved their spots. She loved their ears. But most of all, she loved how FAST they could run!", "Every day, Ella put on her favorite cheetah ears and pretended she was the fastest girl in the world.", "There was just one problem..."], "effect": "none", "nextEffect": "turn"}, {"key": "Page_03", "image": "Page_03.png", "title": "Catch Me If You Can!", "kind": "story", "act": "The Birth of Cheetah Girl", "text": ["Her big brother Luke was FAST, too!", "\"Catch me if you can!\" Luke shouted, racing across the yard.", "\"WAIT FOR MEEEE!\" yelled Ella, running as fast as her little legs could go.", "She ran and ran and ran...", "Until—", "WHOOPS!"], "effect": "whoops", "nextEffect": "turn"}, {"key": "Page_04", "image": "Page_04.png", "title": "A Very Strange Surprise", "kind": "story", "act": "The Birth of Cheetah Girl", "text": ["Ella took a tumble!", "And when she stood back up, something very surprising had happened.", "She had lost a tooth!", "Luke hurried over to check on her.", "But before Ella could say a word, her cheetah ears began to tingle...", "Her sneakers began to sparkle...", "And suddenly—", "ZOOM!"], "effect": "zoom", "nextEffect": "speed"}, {"key": "Page_05", "image": "Page_05.png", "title": "Introducing… CHEETAH GIRL!", "kind": "story", "act": "The Birth of Cheetah Girl", "text": ["WHOOSH!", "Before Luke could blink, Ella was racing around the yard in a blur of yellow spots!", "Her cheetah ears had become a superhero mask. Her clothes had turned into a spotted suit. And a purple cape fluttered behind her.", "\"ELLA?! Is that YOU?!\" Luke shouted.", "Ella flashed her new toothless grin.", "\"Nope! I'm CHEETAH GIRL!\""], "effect": "reveal", "nextEffect": "turn"}, {"key": "Page_06", "image": "Page_06.png", "title": "Meanwhile, Uncle Cha Cha…", "kind": "story", "act": "The Sleepiest Villain in Town", "text": ["Meanwhile, across town, Uncle Cha Cha was trying to take a nap.", "But everywhere he went, children were PLAYING!", "\"WHEEEEE!\" shouted the children.", "\"WAAAAA!\" cried the babies.", "\"WOOF! WOOF!\" barked the dogs.", "Uncle Cha Cha covered his ears.", "\"HOW IS ANYONE SUPPOSED TO SLEEP WITH ALL THIS FUN GOING ON?!\""], "effect": "yawn", "nextEffect": "turn"}, {"key": "Page_07", "image": "Page_07.png", "title": "The Nap-inator 3000", "kind": "story", "act": "The Sleepiest Villain in Town", "text": ["Suddenly, Uncle Cha Cha had an idea.", "A TERRIBLE idea.", "A WONDERFULLY SLEEPY idea!", "\"If I have to be tired,\" he declared, \"EVERYONE has to be tired!\"", "He pulled out his greatest invention...", "THE NAP-INATOR 3000!", "With one giant flip of its purple switch—", "WHOOOOOOOSH!", "Sleepy waves rolled across the town!", "Children yawned. Grown-ups nodded off. Even the squirrels curled up for a snooze.", "Playtime was OVER!"], "effect": "sleep", "nextEffect": "turn"}, {"key": "Page_08", "image": "Page_08.png", "title": "Something Is Very Wrong!", "kind": "story", "act": "The Super Siblings Assemble", "text": ["Cheetah Girl raced into town—", "And skidded to a stop.", "The playground was quiet.", "The park was still.", "Everyone looked SLEEPY.", "Kids yawned on swings. Grown-ups snoozed on benches. Even the dogs were dozing in the grass.", "\"Something's wrong!\" said Ella.", "Then she spotted something strange...", "PURPLE WAVES floating through the air!"], "effect": "sleepies", "nextEffect": "turn"}, {"key": "Page_09", "image": "Page_09.png", "title": "The Secret Behind the Sleepiness", "kind": "story", "act": "The Super Siblings Assemble", "text": ["Cheetah Girl followed the purple waves through town.", "Around a corner...", "Past the fountain...", "And straight to—", "THE EVIL CHA CHA!", "He was standing beside a giant purple machine.", "\"The Nap-inator 3000!\" laughed Cha Cha. \"Soon everyone will be too sleepy to play!\"", "Ella wanted to stop him. But Uncle Cha Cha was a grown-up, and he was guarding the machine!", "\"I can't do this alone,\" she whispered.", "\"I need my SUPER SIBLINGS!\""], "effect": "none", "nextEffect": "turn"}, {"key": "Page_10a", "image": "Page_10a.png", "title": "The Super Siblings!", "kind": "story", "act": "The Super Siblings Assemble", "text": ["Ella raced to find her brother, sisters, and cousin.", "\"Uncle Cha Cha is putting the whole town to sleep!\" she cried. \"I need your help to save everyone!\""], "effect": "recruit", "nextEffect": "transform"}, {"key": "Page_10b", "image": "Page_10b.png", "title": "Meet the Super Team!", "kind": "story", "act": "The Super Siblings Assemble", "text": ["There was Luke, with his super strength!", "There was Quinn, with her mighty GIGGLE BOOM!", "And babies Blake and Connie, whose adorable distraction power could stop anyone in their tracks.", "\"Come on, team!\" shouted Ella.", "\"Let's save our town!\""], "effect": "team", "nextEffect": "speed"}, {"key": "Page_11a", "image": "Page_11a.png", "title": "Into the Park!", "kind": "story", "act": "The Super Siblings Assemble", "text": [], "effect": "dash", "nextEffect": "speed"}, {"key": "Page_11b", "image": "Page_11b.png", "title": "Ella's Brilliant Idea", "kind": "story", "act": "The Super Siblings Assemble", "text": ["Ella peeked around the corner.", "\"But what are we going to do?\" she asked. \"He's a grown-up! We can never defeat a grown-up!\"", "Luke put his hand on Ella's shoulder.", "\"You can do it, Ella,\" he said. \"You're Cheetah Girl! And we're right here to help you.\"", "Ella looked at Uncle Cha Cha, who was already yawning.", "Then she smiled.", "She had a PLAN!", "\"If he wants everyone to be tired,\" she whispered, \"let's make HIM the tiredest of all!\""], "effect": "idea", "nextEffect": "turn"}, {"key": "Page_12", "image": "Page_12.png", "title": "Operation: Distract Cha Cha!", "kind": "story", "act": "The Great Cheetah Chase", "text": ["\"First,\" whispered Ella, \"we need a distraction!\"", "Just then, Blake and Connie gave Uncle Cha Cha their biggest, goofiest smiles.", "\"GAAAA-BA-BA-BA!\" they squealed.", "Uncle Cha Cha stopped in his tracks.", "\"Well, aren't YOU the cutest little—\"", "ZOOM!", "Cheetah Girl raced past in a flash of yellow!", "\"HEY!\" shouted Cha Cha.", "\"GET BACK HERE! NO RUNNING! NO PLAYING!\"", "And just like that, the chase was ON!"], "effect": "babies", "nextEffect": "turn"}, {"key": "Page_13", "image": "Page_13.png", "title": "The Great Cheetah Chase!", "kind": "story", "act": "The Great Cheetah Chase", "text": ["\"BET YOU CAN'T CATCH ME!\" laughed Cheetah Girl.", "\"OH YES I CAN!\" huffed Uncle Cha Cha.", "Around the fountain!", "Through the park!", "Past the playground!", "ZOOM! ZOOM! ZOOOOOM!", "Ella ran faster and faster.", "Cha Cha ran slower and slower.", "And while Cha Cha was busy chasing Ella, Luke quietly snuck toward the Nap-inator.", "\"WAIT... UP...\" Cha Cha panted.", "\"I... JUST... NEED... A... LITTLE...\"", "YAAAAAAAWN!"], "effect": "chase", "nextEffect": "turn"}, {"key": "Page_14a", "image": "Page_14a.png", "title": "Sweet Dreams, Evil Cha Cha!", "kind": "story", "act": "The Great Cheetah Chase", "text": ["Finally, Uncle Cha Cha stumbled onto a park bench.", "\"I... almost... caught... youuuuu...\"", "His eyes closed.", "His head drooped.", "ZZZZZZZZZZ!", "The Evil Cha Cha was ASLEEP!", "Ella gave Luke the signal.", "\"NOW, LUKE!\"", "With one mighty pull, Luke used his super strength to SNAP OFF the Nap-inator's giant switch!", "CRAAAAACK!"], "effect": "break", "nextEffect": "turn"}, {"key": "Page_14b", "image": "Page_14b.png", "title": "Giggle Boom Saves the Day!", "kind": "story", "act": "The Great Cheetah Chase", "text": ["The sleepy purple waves disappeared!", "\"QUINN! SUPER GIGGLE!\" shouted Ella.", "GIGGLE BOOOOOOM!", "The whole town woke up laughing!"], "effect": "giggle", "nextEffect": "turn"}, {"key": "Page_15", "image": "Page_15.png", "title": "The Fastest Hero in Town!", "kind": "story", "act": "Playtime Is Saved!", "text": ["The playground was full of laughter again!", "The children cheered.", "The puppies barked.", "And everyone shouted...", "\"HOORAY FOR CHEETAH GIRL!\"", "Luke gave Ella a big hug.", "Quinn bounced with excitement.", "Blake and Connie gave one more happy squeal.", "Ella flashed her biggest toothless grin.", "She might have lost a tooth...", "But she'd gained the speed to save the whole town!", "And Uncle Cha Cha?", "Well...", "He was still asleep on that park bench.", "SNOOOOOOORE!", "THE END... OR IS IT?"], "effect": "celebrate", "nextEffect": "turn"}];
const q=(s)=>document.querySelector(s);
const artZone=q('#artZone'),artImg=q('#artImg'),vfx=q('#vfx'),prose=q('#prose'),hotspotWrap=q('#hotspots'),hint=q('#hint');
let pageIndex=0,lap=0,magicUsed={},transitionTimer=0,vfxTimer=0,coverRevealed=false;
const oldIndex=()=>pageIndex;
function fmt(s){let str=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); if(str==='THE END... OR IS IT?')return '<span class="ending">'+str+'</span>';if(/^[A-Z][A-Z\s!?.—0-9]+$/.test(s)&&s.length>3)return '<span class="dramatic">'+str+'</span>';return str.replace(/\b([A-Z]{3,}(?:[ -][A-Z]{3,})*)\b/g,'<strong class="shout">$1</strong>');}
function makeHot(label,x,y,w,h,onClick){const b=document.createElement('button');b.className='hotspot';b.setAttribute('aria-label',label);b.title=label;b.style.left=x+'%';b.style.top=y+'%';b.style.width=w+'%';b.style.height=h+'%';b.onclick=onClick;hotspotWrap.append(b);return b;}
function addButton(label, fn){let b=document.createElement('button');b.className='magic-btn';b.textContent=label;b.onclick=fn;hint.appendChild(b);}
function addText(t){let s=document.createElement('span');s.textContent=t;hint.appendChild(s);}
function flash(type){artZone.classList.remove('speed','turn','transform','bounce','happy','charge','shake','yawn','sleepyGlow');void artZone.offsetWidth;if(type)artZone.classList.add(type);clearTimeout(transitionTimer);transitionTimer=setTimeout(()=>artZone.classList.remove(type),980);}
function clearVFX(){clearTimeout(vfxTimer);vfx.replaceChildren();artZone.classList.remove('dim');}
function effect(type){clearVFX();const el=(name,cl)=>{const n=document.createElement('div');n.className=cl||name;vfx.append(n);return n};
 if(type==='sparkles'||type==='magic'||type==='confetti'){let count=type==='confetti'?95:27;for(let i=0;i<count;i++){let n=el('spark',type==='confetti'?'confetti':'spark');if(type==='confetti'){n.style.left=((i*37.7)%100)+'%';n.style.background=['#ffd139','#8d3ace','#f277ce','#ffffff'][i%4];n.style.animationDelay=(i%14)*.07+'s';}else{n.textContent=['✦','✧','★','✶'][i%4];n.style.left=((i*37.7)%95+2)+'%';n.style.top=((i*19.7)%66+16)+'%';n.style.color=['#ffe077','#aa55ec','#fff','#f8bd39'][i%4];n.style.animationDelay=(i%9)*.09+'s';}}}
 if(type==='rings')for(let i=0;i<3;i++)el('ring');
 if(type==='waves')for(let i=0;i<3;i++)el('wave');
 if(type==='sleepies'){[[10,49,30],[27,51,34],[48,34,28],[67,44,34],[84,38,30],[90,70,40],[76,58,30],[18,58,26]].forEach((a,i)=>{let n=el('zzz','zzz-pop');n.textContent=i%3===0?'Zzz':(i%2===0?'zzz':'ZZZ');n.style.left=a[0]+'%';n.style.top=a[1]+'%';n.style.fontSize='clamp(18px,'+a[2]/10+'vw,'+(a[2]+14)+'px)';n.style.animationDelay=(i*.06)+'s'});return;}
 if(type==='lukePower'){[[15,20],[34,18],[28,33]].forEach((a,i)=>{let n=el('burst','power-burst');n.style.left=a[0]+'%';n.style.top=a[1]+'%';n.style.animationDelay=(i*.08)+'s'});return;}
 if(type==='quinnWaves'){[[78,42,7,11,'#b544f3'],[83,42,8.5,13,'#ffb03a'],[88,42,10,15,'#b544f3']].forEach((a,i)=>{let n=el('qwave','quinn-wave');n.style.left=a[0]+'%';n.style.top=a[1]+'%';n.style.width=a[2]+'%';n.style.height=a[3]+'%';n.style.borderColor=a[4];n.style.animationDelay=(i*.06)+'s'});return;}
 if(type==='babyCute'){[[11,59],[27,59]].forEach((center,j)=>{[[-6,-7,7,'-35deg'],[0,-12,7,'-90deg'],[6,-7,7,'35deg'],[-8,3,7,'-20deg'],[8,3,7,'20deg']].forEach((a,i)=>{let n=el('ray','baby-ray');n.style.left=(center[0]+a[0])+'%';n.style.top=(center[1]+a[1])+'%';n.style.width=a[2]+'%';n.style.transform='translate(-50%,-50%) rotate('+a[3]+')';n.style.animationDelay=(i*.05+j*.09)+'s'});});return;}
 if(type==='babyDistract'){[[22.5,60.5],[37.3,60.5]].forEach((center,j)=>{[[-6,-7,8,'-35deg'],[0,-12,8,'-90deg'],[6,-7,8,'35deg'],[-8,2.5,7,'-18deg'],[8,2.5,7,'18deg']].forEach((a,i)=>{let n=el('ray','baby-ray');n.style.left=(center[0]+a[0])+'%';n.style.top=(center[1]+a[1])+'%';n.style.width=a[2]+'%';n.style.transform='translate(-50%,-50%) rotate('+a[3]+')';n.style.animationDelay=(i*.05+j*.09)+'s'});});return;}
 if(type==='speed')for(let i=0;i<3;i++)el('streak');
 if(type==='boom'){effect('rings');let n=el('label','burst-label');n.textContent='GIGGLE BOOOOM!';return;}
 if(type==='machineBoom'){const n=document.createElement('img');n.className='boom-overlay';n.src='assets/comic_book_boom_explosion_burst.png';n.alt='Comic book BOOM explosion';n.decoding='async';vfx.append(n);return;}
 if(type==='label'){let n=el('label','yawn-bubble');n.textContent='YAAAAAWN!';}
 if(type==='pawThought'){
  const n=el('thought','paw-thought');
  n.innerHTML='<svg viewBox="0 0 160 178" role="img" aria-label="A light bulb containing a paw print" xmlns="http://www.w3.org/2000/svg"><g stroke="#47186d" stroke-width="6" stroke-linejoin="round"><path fill="#ffd44a" d="M80 12 C40 12 18 42 22 76 C25 102 45 112 52 132 L108 132 C115 110 135 101 138 76 C142 40 117 12 80 12 Z"/><rect x="54" y="132" width="52" height="13" rx="5" fill="#9b53cb"/><rect x="59" y="145" width="42" height="12" rx="5" fill="#9b53cb"/><path d="M68 160 Q80 170 92 160" fill="none" stroke-linecap="round"/></g><g fill="#48166a"><ellipse cx="47" cy="76" rx="10" ry="13" transform="rotate(-19 47 76)"/><ellipse cx="69" cy="58" rx="10" ry="13" transform="rotate(-8 69 58)"/><ellipse cx="94" cy="57" rx="10" ry="13" transform="rotate(13 94 57)"/><ellipse cx="114" cy="77" rx="10" ry="13" transform="rotate(25 114 77)"/><path d="M80 79 C64 79 61 91 53 101 C46 111 51 124 64 123 C71 122 74 116 80 116 C88 116 93 124 103 123 C115 123 120 110 110 100 C99 85 98 79 80 79Z"/></g><path d="M62 33 Q80 24 98 33" fill="none" stroke="#fff7bc" stroke-width="6" stroke-linecap="round"/></svg>';
 }
 if(type==='lap'){let n=el('lap');n.textContent='ZOOM! '+lap+' / 3';}
 vfxTimer=setTimeout(()=>{vfx.replaceChildren()},type==='confetti'?2600:1750);
}
function jump(i, mode){const next=Math.min(Math.max(i,0),pages.length-1);if(next===0 && pageIndex!==0)coverRevealed=false;const old=pages[pageIndex];pageIndex=next;lap=0;clearVFX();const target=pages[pageIndex];render();let trans=mode||old?.nextEffect||(old?.act&&old.act!==target.act?'turn':'turn');if(pageIndex===0)trans='turn';flash(trans==='speed'?'speed':trans==='transform'?'transform':'turn');}
function action(name){const p=pages[pageIndex];switch(name){
 case 'whoops':flash('bounce');effect('sparkles');break;
 case 'zoom':effect('speed');flash('charge');setTimeout(()=>{if(pages[pageIndex]===p)jump(pageIndex+1,'transform')},490);break;
 case 'reveal':flash('speed');effect('speed');break;
 case 'yawn':flash('yawn');effect('label');break;
 case 'sleep':effect('waves');artZone.classList.add('dim');break;
 case 'waves':effect('waves');break;
 case 'sleepies':flash('sleepyGlow');effect('sleepies');break;
 case 'lukePower':flash('charge');effect('lukePower');break;
 case 'quinnWaves':flash('happy');effect('quinnWaves');break;
 case 'babyCute':flash('happy');effect('babyCute');break;
 case 'discover':flash('happy');effect('sparkles');break;
 case 'recruit':effect('sparkles');setTimeout(()=>{if(pages[pageIndex]===p)jump(pageIndex+1,'transform')},460);break;
 case 'team':flash('charge');effect('sparkles');break;
 case 'dash':effect('speed');jump(pageIndex+1,'speed');break;
 case 'idea':effect('pawThought');break;
 case 'babies':flash('happy');effect('babyDistract');break;
 case 'chase':lap=Math.min(lap+1,3);flash('speed');effect('speed');setTimeout(()=>{if(pages[pageIndex]===p){let e=document.createElement('div');e.className='lap';e.textContent=lap===3?'Cha Cha is EXHAUSTED!':'ZOOM! Lap '+lap+' of 3';vfx.append(e);setTimeout(()=>e.remove(),1300)}},250);break;
 case 'break':flash('shake');effect('machineBoom');break;
 case 'giggle':flash('happy');effect('boom');break;
 case 'celebrate':effect('confetti');break;
 }}
function startCover(){if(coverRevealed){jump(1);return;}coverRevealed=true;const shell=q('#bookShell');shell.classList.remove('cover-revealed');void shell.offsetWidth;shell.classList.add('cover-revealed');q('#coverPrompt').textContent='✦ Tap a hero to meet them!';}
function render(){const p=pages[pageIndex];q('#section').hidden=p.kind==='story';q('#title').hidden=p.kind==='story';q('#bookShell').classList.toggle('illustration-only',p.key==='Page_11a');q('#bookShell').classList.toggle('is-cover',p.kind==='cover');q('#bookShell').classList.toggle('cover-revealed',p.kind==='cover' && coverRevealed);artImg.src='assets/'+p.image;artImg.alt=p.title+' illustration';q('#title').textContent=p.title;q('#section').textContent=p.kind==='cover'?'A SUPER-SPEED STORYBOOK':p.kind==='character'?'MEET THE CHARACTERS':p.act;prose.replaceChildren();p.text.forEach(t=>{const para=document.createElement('p');para.innerHTML=fmt(t);prose.append(para)});prose.scrollTop=0;hotspotWrap.replaceChildren();hint.replaceChildren();q('#coverPrompt').hidden=p.kind!=='cover';if(p.kind==='cover')q('#coverPrompt').textContent=coverRevealed?'✦ Tap a hero to meet them!':'✦ Click to Start!';
 if(p.kind==='cover'){q('#title').textContent='';q('#section').textContent='';
 // Cover character hotspots: face-focused coordinates, percentages of the 16:9 illustration.
 makeHot('Meet Luke',15.5,42.5,11,19,()=>jump(2));
 makeHot('Meet Cheetah Girl',39,31,17,30,()=>jump(1));
 makeHot('Meet Quinn',64,44,12,20,()=>jump(3));
 makeHot('Meet Blake',75,68,11,18,()=>jump(4));
 makeHot('Meet Connie',85,68,12,18,()=>jump(4));
 makeHot('Meet Evil Cha Cha',67.5,15,10,19,()=>jump(5));
 }else if(p.kind==='character'){addText('The adventure begins after the introductions.');addButton('✦ Meet the next hero',()=>jump(pageIndex+1));}
 else{
 const effects={whoops:['💫 WHOOPS!','Tap to make a playful bounce'],zoom:['⚡ ZOOM!','Tap to transform Ella'],reveal:['⚡ SUPER SPEED!','Tap to see Ella’s speed'],yawn:['🥱 Giant yawn','Tap Cha Cha'],sleep:['🌙 Flip the switch','Tap the switch'],sleepies:['😴 Sleepy Zzzs','Tap Ella'],recruit:['✨ Transform the team!','Tap to reveal the superheroes'],dash:['💨 Super sibling dash','Tap to zoom into the park'],idea:['🐾 Ella has a plan!','Tap Ella'],babies:['👶 Baby distraction!','Tap the babies'],chase:['⚡ ZOOM!','Tap three times to race'],break:['💥 BOOM!','Tap the machine'],giggle:['😂 GIGGLE BOOM!','Tap Quinn'],celebrate:['🎉 HOORAY!','Celebrate Ella’s victory']};
 const hotspots={whoops:[[9,64,23,31]],zoom:[[18,19,44,70]],reveal:[[13,9,58,86]],yawn:[[38,25,35,53]],sleep:[[47.6,51.4,7.9,13.3]],sleepies:[[17,28,22,23]],recruit:[[59,19,36,73]],dash:[[15,25,66,69]],idea:[[22,24,32,65]],babies:[[13,41,32,36]],chase:[[30,25,50,70]],break:[[19,14,25,48]],giggle:[[58,31,30,59]],celebrate:[[18,29,45,65]]};
 if(p.key==='Page_10b'){
   hint.replaceChildren();
   addButton('💪 Luke Power!',()=>action('lukePower'));
   addButton('🔊 Quinn Giggle!',()=>action('quinnWaves'));
   addButton('✨ Baby Cuteness!',()=>action('babyCute'));
   addText("Tap each face to see that hero's power. Optional");
   makeHot('Luke power',11,7,18,18,()=>action('lukePower'));
   makeHot('Quinn power',67,14,16,20,()=>action('quinnWaves'));
   makeHot('Baby Blake cuteness',1,46,13,17,()=>action('babyCute'));
  makeHot('Baby Connie cuteness',20,47,13,17,()=>action('babyCute'));
 } else {
   let row=effects[p.effect];
   if(row){addButton(row[0],()=>action(p.effect));addText(row[1]+' · Optional');}
   (hotspots[p.effect]||[]).forEach((a,i)=>makeHot((row?row[0]:'Magic').replace(/^[^A-Za-z]+/,''),...a,()=>action(p.effect)));
 }
 if(p.effect==='celebrate')addButton('↻ Read Again',()=>jump(0));
